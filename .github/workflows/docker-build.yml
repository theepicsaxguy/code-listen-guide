name: Docker Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Dockerfile.frontend'
      - 'backend/Dockerfile'
      - 'src/**'
      - 'public/**'
      - 'components.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - 'tailwind.config.ts'
      - 'postcss.config.js'
      - 'eslint.config.js'
      - 'backend/**'
      - '.github/workflows/docker-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile.frontend'
      - 'backend/Dockerfile'
      - 'src/**'
      - 'public/**'
      - 'components.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - 'tailwind.config.ts'
      - 'postcss.config.js'
      - 'eslint.config.js'
      - 'backend/**'
      - '.github/workflows/docker-build.yml'

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.frontend }}
      backend: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v5

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'Dockerfile.frontend'
              - 'src/**'
              - 'public/**'
              - 'components.json'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - 'vite.config.ts'
              - 'tailwind.config.ts'
              - 'postcss.config.js'
              - 'eslint.config.js'
              - '.github/workflows/docker-build.yml'
            backend:
              - 'backend/Dockerfile'
              - 'backend/**'
              - '.github/workflows/docker-build.yml'

  build-images:
    name: Build ${{ matrix.service }} image
    needs: changes
    if: |
      (matrix.change-key == 'frontend' && needs.changes.outputs.frontend == 'true') ||
      (matrix.change-key == 'backend' && needs.changes.outputs.backend == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: frontend
            context: .
            file: Dockerfile.frontend
            change-key: frontend
          - service: backend
            context: backend
            file: backend/Dockerfile
            change-key: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure cache
        id: cache
        run: |
          {
            echo "from<<'EOF'"
            echo "type=gha"
            echo "type=registry,ref=ghcr.io/${{ github.repository_owner }}/code-listen-guide-${{ matrix.service }}:buildcache"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          if [[ "${{ github.event_name }}" == 'push' ]]; then
            {
              echo "to<<'EOF'"
              echo "type=gha,mode=max"
              echo "type=registry,ref=ghcr.io/${{ github.repository_owner }}/code-listen-guide-${{ matrix.service }}:buildcache,mode=max"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "to<<'EOF'"
              echo "type=gha,mode=max"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/code-listen-guide-${{ matrix.service }}:${{ github.sha }}
            ${{ github.event_name == 'push' && format('ghcr.io/{0}/code-listen-guide-{1}:latest', github.repository_owner, matrix.service) || '' }}
          cache-from: ${{ steps.cache.outputs.from }}
          cache-to: ${{ steps.cache.outputs.to }}
