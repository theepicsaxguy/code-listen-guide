name: Docker Build

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile.frontend'
      - 'backend/Dockerfile'
      - 'src/**'
      - 'public/**'
      - 'components.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - 'tailwind.config.ts'
      - 'postcss.config.js'
      - 'eslint.config.js'
      - 'backend/**'
      - '.github/workflows/docker-build.yml'

jobs:
  changes:
    name: Detect Changes
    if: >-
      (github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'pull_request' &&
         contains(github.event.pull_request.labels.*.name, 'build')))
      &&
      (github.event_name != 'pull_request' ||
        (!github.event.pull_request.draft &&
         !contains(format('{0}\n{1}', github.event.pull_request.title, github.event.pull_request.body), '[skip ci]') &&
         !contains(format('{0}\n{1}', github.event.pull_request.title, github.event.pull_request.body), '[ci skip]') &&
         !contains(format('{0}\n{1}', github.event.pull_request.title, github.event.pull_request.body), '[skip actions]') &&
         !contains(github.event.pull_request.labels.*.name, 'skip-ci') &&
         !contains(github.event.pull_request.labels.*.name, 'skip-actions')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.frontend }}
      backend: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.backend }}
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_changes: ${{ steps.set-matrix.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v6

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'Dockerfile.frontend'
              - 'src/**'
              - 'public/**'
              - 'components.json'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - 'vite.config.ts'
              - 'tailwind.config.ts'
              - 'postcss.config.js'
              - 'eslint.config.js'
              - '.github/workflows/docker-build.yml'
            backend:
              - 'backend/Dockerfile'
              - 'backend/**'
              - '.github/workflows/docker-build.yml'

      - id: set-matrix
        env:
          BUILD_FRONTEND: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.frontend }}
          BUILD_BACKEND: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.backend }}
        run: |
          python - <<'PY'
          import json
          import os

          matrix = {"include": []}

          if os.environ.get("BUILD_FRONTEND") == "true":
              matrix["include"].append(
                  {
                      "service": "frontend",
                      "context": ".",
                      "file": "Dockerfile.frontend",
                      "change-key": "frontend",
                  }
              )

          if os.environ.get("BUILD_BACKEND") == "true":
              matrix["include"].append(
                  {
                      "service": "backend",
                      "context": "backend",
                      "file": "backend/Dockerfile",
                      "change-key": "backend",
                  }
              )

          has_changes = "true" if matrix["include"] else "false"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"matrix={json.dumps(matrix)}\n")
              fh.write(f"has_changes={has_changes}\n")
          PY

  build-images:
    name: Build ${{ matrix.service }} image
    needs: changes
    if: ${{ needs.changes.outputs.has_changes == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix: ${{ fromJson(needs.changes.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure cache
        id: cache
        run: |
          echo "from<<EOF" >> "$GITHUB_OUTPUT"
          echo "type=gha" >> "$GITHUB_OUTPUT"
          echo "type=registry,ref=ghcr.io/${{ github.repository_owner }}/code-listen-guide-${{ matrix.service }}:buildcache" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          if [[ "${{ github.event_name }}" == 'push' ]]; then
            echo "to<<EOF" >> "$GITHUB_OUTPUT"
            echo "type=gha,mode=max" >> "$GITHUB_OUTPUT"
            echo "type=registry,ref=ghcr.io/${{ github.repository_owner }}/code-listen-guide-${{ matrix.service }}:buildcache,mode=max" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            echo "to<<EOF" >> "$GITHUB_OUTPUT"
            echo "type=gha,mode=max" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/code-listen-guide-${{ matrix.service }}:${{ github.sha }}
            ${{ github.event_name == 'push' && format('ghcr.io/{0}/code-listen-guide-{1}:latest', github.repository_owner, matrix.service) || '' }}
          cache-from: ${{ steps.cache.outputs.from }}
          cache-to: ${{ steps.cache.outputs.to }}
