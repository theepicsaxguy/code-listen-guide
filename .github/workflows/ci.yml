name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'components.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - 'tailwind.config.ts'
      - 'postcss.config.js'
      - 'eslint.config.js'
      - 'backend/**'
      - 'pytest.ini'
      - 'backend/requirements.txt'
      - 'backend/requirements-*.txt'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'components.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - 'tailwind.config.ts'
      - 'postcss.config.js'
      - 'eslint.config.js'
      - 'backend/**'
      - 'pytest.ini'
      - 'backend/requirements.txt'
      - 'backend/requirements-*.txt'
      - '.github/workflows/ci.yml'

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v5

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'src/**'
              - 'public/**'
              - 'components.json'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - 'vite.config.ts'
              - 'tailwind.config.ts'
              - 'postcss.config.js'
              - 'eslint.config.js'
            backend:
              - 'backend/**'
              - 'pytest.ini'
              - 'backend/requirements.txt'
              - 'backend/requirements-*.txt'

  frontend:
    name: Frontend Build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build frontend
        run: npm run build

  backend:
    name: Backend Tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          cd backend
          python -m pip install -U pip setuptools wheel
          python -m pip install -U -r requirements.txt

      - name: Run unit tests
        run: |
          cd backend
          pytest -m unit -v --tb=short

      - name: Run Docling tests (allowed to fail)
        run: |
          cd backend
          pytest -m docling -v --tb=short
        continue-on-error: true

      - name: Run agent tests
        run: |
          cd backend
          pytest -m agents -v --tb=short

      - name: Run service tests
        run: |
          cd backend
          pytest -m services -v --tb=short

      - name: Run API tests
        run: |
          cd backend
          pytest -m api -v --tb=short

      - name: Run workflow tests
        run: |
          cd backend
          pytest -m workflows -v --tb=short

      - name: Run model tests
        run: |
          cd backend
          pytest -m models -v --tb=short

      - name: Run integration tests (allowed to fail)
        run: |
          cd backend
          pytest -m integration -v --tb=short
        continue-on-error: true

      - name: Generate coverage report
        run: |
          cd backend
          pytest --cov=backend --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./backend/coverage.xml
          flags: backend
          name: backend-coverage
        continue-on-error: true
