name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'components.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - 'tailwind.config.ts'
      - 'postcss.config.js'
      - 'eslint.config.js'
      - 'backend/**'
      - 'pytest.ini'
      - 'backend/requirements.txt'
      - 'backend/requirements-*.txt'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'components.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - 'tailwind.config.ts'
      - 'postcss.config.js'
      - 'eslint.config.js'
      - 'backend/**'
      - 'pytest.ini'
      - 'backend/requirements.txt'
      - 'backend/requirements-*.txt'
      - '.github/workflows/ci.yml'

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v5

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'src/**'
              - 'public/**'
              - 'components.json'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - 'vite.config.ts'
              - 'tailwind.config.ts'
              - 'postcss.config.js'
              - 'eslint.config.js'
            backend:
              - 'backend/**'
              - 'pytest.ini'
              - 'backend/requirements.txt'
              - 'backend/requirements-*.txt'

  frontend:
    name: Frontend Build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build frontend
        run: npm run build

      - name: Verify frontend dev server starts
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 --port 4173 >frontend-dev.log 2>&1 &
          DEV_PID=$!
          trap 'kill $DEV_PID 2>/dev/null || true' EXIT
          started=0
          for attempt in $(seq 1 30); do
            if curl -sSf http://127.0.0.1:4173/ >/dev/null; then
              started=1
              break
            fi
            if ! kill -0 $DEV_PID 2>/dev/null; then
              cat frontend-dev.log
              echo "Frontend dev server exited unexpectedly"
              exit 1
            fi
            sleep 2
          done
          if [ "$started" -ne 1 ]; then
            cat frontend-dev.log
            echo "Frontend dev server did not respond in time"
            exit 1
          fi
          trap - EXIT
          kill $DEV_PID
          wait $DEV_PID || true

  backend:
    name: Backend Tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            build-essential \
            libxml2-dev \
            libxslt1-dev \
            zlib1g-dev

      - name: Install Python dependencies
        run: |
          cd backend
          python -m pip install -U pip setuptools wheel
          python -m pip install -U -r requirements.txt

      - name: Verify backend server starts
        run: |
          set -euo pipefail
          cd backend
          uvicorn backend.main:app --host 127.0.0.1 --port 8000 --log-level warning >backend-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          started=0
          for attempt in $(seq 1 30); do
            if curl -sSf http://127.0.0.1:8000/docs >/dev/null; then
              started=1
              break
            fi
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              cat backend-server.log
              echo "Backend server exited unexpectedly"
              exit 1
            fi
            sleep 2
          done
          if [ "$started" -ne 1 ]; then
            cat backend-server.log
            echo "Backend server did not respond in time"
            exit 1
          fi
          trap - EXIT
          kill $SERVER_PID
          wait $SERVER_PID || true

      - name: Run unit tests
        run: |
          cd backend
          pytest -m unit -v --tb=short

      - name: Run Docling tests (allowed to fail)
        run: |
          cd backend
          pytest -m docling -v --tb=short
        continue-on-error: true

      - name: Run agent tests
        run: |
          cd backend
          pytest -m agents -v --tb=short

      - name: Run service tests
        run: |
          cd backend
          pytest -m services -v --tb=short

      - name: Run API tests
        run: |
          cd backend
          pytest -m api -v --tb=short

      - name: Run workflow tests
        run: |
          cd backend
          pytest -m workflows -v --tb=short

      - name: Run model tests
        run: |
          cd backend
          pytest -m models -v --tb=short

      - name: Run integration tests (allowed to fail)
        run: |
          cd backend
          pytest -m integration -v --tb=short
        continue-on-error: true

      - name: Generate coverage report
        run: |
          cd backend
          pytest --cov=backend --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./backend/coverage.xml
          flags: backend
          name: backend-coverage
        continue-on-error: true
