name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      
      - name: Verify API client is generated
        run: |
          if [ ! -d "src/lib/api/generated" ] || [ -z "$(ls -A src/lib/api/generated/*.ts 2>/dev/null)" ]; then
            echo "ERROR: Generated API client not found. Run 'npm run generate:api' before committing."
            exit 1
          fi
          echo "✓ Generated API client found"
      
      - name: Lint
        run: npm run lint:eslint
      
      - name: Build
        run: npm run build

  api-generation-check:
    runs-on: ubuntu-latest
    needs: []
    steps:
      - uses: actions/checkout@v5
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      
      - name: Start backend (if available)
        run: |
          # This step would need backend setup in CI
          # For now, we just verify the generation script exists
          echo "Note: Backend must be running for API generation"
          echo "In production CI, add backend startup here"
        continue-on-error: true
      
      - name: Generate API client
        run: |
          # In real CI, backend would be running
          # npm run generate:api || echo "Generation requires running backend"
          echo "Skipping generation check - backend not available in CI"
        continue-on-error: true
      
      - name: Check for manual API imports
        run: |
          if grep -r "from '@/lib/api'" src/ --exclude-dir=generated 2>/dev/null; then
            echo "WARNING: Found imports from @/lib/api - these should use generated hooks"
            echo "This is expected during migration"
          fi
