name: Code Quality

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'pytest.ini'
      - '.github/workflows/code-quality.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'pytest.ini'
      - '.github/workflows/code-quality.yml'

jobs:
  linting:
    name: Linting and Type Checking
    runs-on: ubuntu-latest
    if: >-
      (github.event_name != 'push' ||
        (!contains(github.event.head_commit.message, '[skip ci]') &&
         !contains(github.event.head_commit.message, '[ci skip]') &&
         !contains(github.event.head_commit.message, '[skip actions]')))
      &&
      (github.event_name != 'pull_request' ||
        (!github.event.pull_request.draft &&
         !contains(format('{0}\n{1}', github.event.pull_request.title, github.event.pull_request.body), '[skip ci]') &&
         !contains(format('{0}\n{1}', github.event.pull_request.title, github.event.pull_request.body), '[ci skip]') &&
         !contains(format('{0}\n{1}', github.event.pull_request.title, github.event.pull_request.body), '[skip actions]') &&
         !contains(github.event.pull_request.labels.*.name, 'skip-ci') &&
         !contains(github.event.pull_request.labels.*.name, 'skip-actions')))

    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip

      - name: Install dependencies
        run: |
          cd backend
          pip install black flake8 mypy

      - name: Run Black
        run: |
          cd backend
          black --check .

      - name: Run Flake8
        run: |
          cd backend
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run MyPy
        run: |
          cd backend
          mypy . --ignore-missing-imports
        continue-on-error: true
