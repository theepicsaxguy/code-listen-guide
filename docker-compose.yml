services:
  backend:
    image: ghcr.io/theepicsaxguy/code-listen-guide-backend:latest
    environment:
      ENVIRONMENT: production
      FRONTEND_URL: http://localhost:8081
    ports:
      - "8001:8000"
  frontend:
    image: ghcr.io/theepicsaxguy/code-listen-guide-frontend:latest
    environment:
      VITE_API_BASE_URL: http://backend:8000/api/v1
    depends_on:
      - backend
    ports:
      - "8081:8080"