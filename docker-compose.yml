version: "3.9"

services:
  backend:
    build:
      context: .
      target: production
    environment:
      ENVIRONMENT: production
      FRONTEND_URL: http://localhost:8080
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    depends_on:
      - backend
    ports:
      - "8080:80"
