services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: audiobook
      POSTGRES_PASSWORD: audiobook_dev_password
      POSTGRES_DB: audiobook
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audiobook"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: code-listen-guide-backend:latest
    environment:
      ENVIRONMENT: production
      FRONTEND_URL: http://frontend:8080
      DATABASE_URL: postgresql://audiobook:audiobook_dev_password@postgres:5432/audiobook
      CHECKPOINT_DATABASE_URL: postgresql://audiobook:audiobook_dev_password@postgres:5432/audiobook
    env_file:
      - ${BACKEND_ENV_FILE:-backend/.env.docker}
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: production
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://backend:8000/api/v1}
    image: code-listen-guide-frontend:latest
    environment:
      VITE_API_BASE_URL: http://backend:8000/api/v1
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
