services:
  postgres:
    image: postgres:18.0-alpine
    environment:
      POSTGRES_USER: audiobook
      POSTGRES_PASSWORD: audiobook_dev_password
      POSTGRES_DB: audiobook
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audiobook"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:8.2.0-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Full-stack service (frontend + backend) using multi-stage root Dockerfile
  backend:
    build:
      context: .
      dockerfile: Dockerfile  # Root multi-stage Dockerfile (frontend + backend)
      target: production
      cache_from:
        - code-listen-guide-backend:latest
    image: code-listen-guide-backend:latest
    environment:
      ENVIRONMENT: production
      FRONTEND_URL: http://frontend:8080
      DATABASE_URL: postgresql://audiobook:audiobook_dev_password@postgres:5432/audiobook
      CHECKPOINT_DATABASE_URL: postgresql://audiobook:audiobook_dev_password@postgres:5432/audiobook
    env_file:
      - ${BACKEND_ENV_FILE:-backend/.env.docker}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Frontend-only service using dedicated frontend Dockerfile
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend  # Frontend-only Dockerfile
      target: production
      args:
        VITE_API_BASE_PATH: /api/v1
      cache_from:
        - code-listen-guide-frontend:latest
    image: code-listen-guide-frontend:latest
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:

x-buildkit:
  buildkit:
    enabled: true
