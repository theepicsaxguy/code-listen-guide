[pytest]
# Pytest configuration for Codebase Audiobook backend tests

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = backend/tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=backend
    --cov-report=term-missing
    --cov-report=html:coverage_html
    --cov-report=xml:coverage.xml
    --asyncio-mode=auto

# Markers for categorizing tests
markers =
    unit: Unit tests for individual components
    integration: Integration tests across multiple components
    slow: Tests that take a long time to run
    chonkie: Tests requiring chonkie installation
    agents: Tests for Microsoft Agent Framework agents
    api: API route tests
    services: Service layer tests
    models: Database model tests
    workflows: Workflow orchestration tests
    requires_env: Tests requiring environment variables (API keys, etc.)

# Async configuration
asyncio_mode = auto

# Coverage options
[coverage:run]
source = backend
omit =
    backend/tests/*
    backend/examples/*
    backend/migrations/*
    */venv/*
    */site-packages/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
