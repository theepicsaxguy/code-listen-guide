<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Codebase Audiobook Open Graph Image</title>
  <desc id="desc">Dark gradient background with Codebase Audiobook logotype and tagline.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#20114b" />
      <stop offset="50%" stop-color="#2f1b6a" />
      <stop offset="100%" stop-color="#04050f" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <g transform="translate(120, 160)">
    <rect x="-20" y="-20" width="520" height="330" rx="28" fill="rgba(12, 10, 31, 0.65)" stroke="rgba(168, 85, 247, 0.35)" stroke-width="2" />
    <circle cx="40" cy="40" r="18" fill="rgba(168, 85, 247, 0.9)" />
    <rect x="78" y="25" width="180" height="12" rx="6" fill="rgba(180, 198, 255, 0.8)" />
    <rect x="78" y="52" width="280" height="12" rx="6" fill="rgba(116, 130, 215, 0.8)" />
    <rect x="40" y="100" width="380" height="12" rx="6" fill="rgba(180, 198, 255, 0.5)" />
    <rect x="40" y="130" width="340" height="12" rx="6" fill="rgba(180, 198, 255, 0.25)" />
    <rect x="40" y="160" width="360" height="12" rx="6" fill="rgba(180, 198, 255, 0.4)" />
    <g transform="translate(40, 210)" opacity="0.7">
      <rect x="0" y="0" width="260" height="12" rx="6" fill="#8b5cf6" />
      <rect x="0" y="26" width="220" height="12" rx="6" fill="#a855f7" />
      <rect x="0" y="52" width="300" height="12" rx="6" fill="#6366f1" />
    </g>
  </g>
  <g transform="translate(680, 210)">
    <text x="0" y="0" font-family="'Inter', 'Segoe UI', sans-serif" font-size="60" font-weight="700" fill="#f4f4ff">Codebase</text>
    <text x="0" y="70" font-family="'Inter', 'Segoe UI', sans-serif" font-size="60" font-weight="700" fill="#f4f4ff">Audiobook</text>
    <rect x="0" y="96" width="360" height="8" rx="4" fill="url(#accent)" filter="url(#glow)" />
    <text x="0" y="150" font-family="'Inter', 'Segoe UI', sans-serif" font-size="28" font-weight="500" fill="rgba(223, 226, 255, 0.92)">
      Turn GitHub repos into narrated tours.
    </text>
    <text x="0" y="190" font-family="'Inter', 'Segoe UI', sans-serif" font-size="20" font-weight="400" fill="rgba(188, 200, 255, 0.76)">
      Stream deep-dives, architecture notes, and production checklists.
    </text>
  </g>
  <g transform="translate(680, 430)" opacity="0.6">
    <rect x="0" y="0" width="420" height="18" rx="9" fill="#4338ca" />
    <rect x="12" y="4" width="396" height="10" rx="5" fill="#a855f7" />
  </g>
</svg>
