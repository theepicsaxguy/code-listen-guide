[alembic]
script_location = db/migrations
prepend_sys_path = .

timezone = UTC

# This will be overridden by env.py from .env settings
sqlalchemy.url = postgresql://audiobook:audiobook_dev_password@localhost:5433/audiobook

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
